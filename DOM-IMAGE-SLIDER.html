<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        * {
            margin: 0;
        }

        .main {
            width: 100vw;
            height: 100vh;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center {
            width: 80%;
            height: 80%;
            position: relative;
        }

        .images {
            width: 100%;
            height: 100%;
        }

        .images img {
            width: 100%;
            height: 100%;
            display: none;
        }

        .images img:first-child {
            display: block;
        }

        .btn {
            position: absolute;
            top: 45%;
            background: none;
            color: white;
            border: none;
        }

        #btnLeft {
            left: 30px;
        }

        #btnRight {
            right: 30px;
        }

        .icon {
            font-size: 40px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="center">
            <div class="images" onmouseenter="playPause('pause')" onmouseleave="playPause('play')">

                <img src="/images/p1.jpg " alt="">
                <img src="/images/p2.jpg " alt="">
                <img src="/images/p3.jpg " alt="">
                <img src="/images/p4.jpg " alt="">
                <img src="/images/p5.jpg " alt="">
                <img src="/images/p6.jpg " alt="">
                <img src="/images/p7.jpg " alt="">
                <img src="/images/p8.jpg " alt="">
                <img src="/images/p9.jpg " alt="">
                <img src="/images/p10.jpg " alt="">
            </div>
            <button id="btnLeft" onclick="previous()" class="btn">
                <span class="icon material-symbols-outlined">
                    arrow_back_ios
                </span></button>

            <button id="btnRight" class="btn" onclick="next()">
                <span class="icon material-symbols-outlined">
                    arrow_forward_ios
                </span></button>
        </div>
    </div>
    <script>

        var images = document.querySelectorAll(".images img")
        var index = 0

        function previous() {
            images[index].style.display = "none"
            if (index == 0)
                index = images.length - 1
            else
                index--
            images[index].style.display = "block"
        }

            function next() {
                images[index].style.display = "none"
                if (index < images.lenght - 1)
                    index++
                else
                    index = 0
                images[index].style.display = "block"
            }

            let time = setInterval(next, 2000)
            function playPause(option) {
                if (option === "pause")
                    clearInterval(time)
                else
                    time = setInterval(next, 2000)
            }
        
    </script>
</body>

</html>
