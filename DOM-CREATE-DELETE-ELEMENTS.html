<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="<link rel=" stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete" />
    <style>
        * {
            margin: 0;
        }

        .main {
            width: 100vw;
            height: 100vh;
        }

        .center {
            width: 80%;
            height: 100%;
            margin: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .center.first {
            width: 100%;
            height: 80%;
            display: flex;
            justify-content: space-between;
        }

        .center.firstbutton {
            width: 33%;
            background-color: navy;
            color: white;
            border: none;
        }

        .center.second {
            width: 100%;
            height: 90%;
            overflow: auto;
        }

        .center.second ::-webkit-scrollbar {
            display: none;
        }

        .center.second p {
            background-color: navy;
            color: white;
            padding: 20px;
            margin-bottom: 10px;
        }

        .icon {
            float: right;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="center">
            <div class="first">
                <button onclick="createRecord()">Create</button>
                <button onclick="deleteFirst()">deleteFirst</button>
                <button onclick="deleteAll()">DeleteAll</button>

            </div>
        </div class="second">
    </div>
    <script>
        var center = document.querySelector(".center")
        var second = document.querySelector(".second")
        var count = 1
        function createRecord() {
            var p = document.createElement("p")
            p.id = `p${count}`
            // let message = prompt("Enter your message")
            // p.innerHTML = message //
            p.innerHTML = `This is Pragraph p${count} <span class = "<span class="material-symbols-outlined icon"
            onclick = "deleteItem('p ${count}')">delete</span>`
            count ++
            second.appendChild(p)
        }
        function deleteItem(id){
            second.removeChild(document.getElementById(id))
        }
        function deleteFirst(){
            // console.log(second.childNodes)
            if(second.childNodes.length>1)
            second.removeChild(second.childNodes[1])
        }
        function deleteAll(){
            center.removeChild(second)
            second = document.createElement("div")
            second.classList.add("second")
            second.appendChild(second)        
        }
       

    </script>
</body>

</html>
